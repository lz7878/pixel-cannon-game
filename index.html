<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#221b46" />
    <title>像素共振 · Pixel Resonance</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="像素共振游戏">
      <section class="play-area">
        <header class="hud">
          <button id="soundButton" class="round-button" aria-label="切换音效">♪</button>
          <div class="level-copy"><strong>关卡1</strong></div>
          <button id="restartButton" class="round-button" aria-label="重新开始">↻</button>
        </header>

        <div class="level-tools" aria-label="关卡测试工具">
          <select id="levelSet" aria-label="关卡版本">
            <option value="new">新版关卡</option>
            <option value="original">旧版关卡</option>
          </select>
          <label>第 <input id="levelJump" type="number" min="1" max="10" value="1" inputmode="numeric" aria-label="关卡序号" /> 关</label>
          <button id="levelGo" type="button">跳转</button>
        </div>

        <div class="mission-card" aria-label="关卡进度">
          <span>✦ 爆破所有色块</span>
          <div class="progress-wrap">
            <span id="blockCount">0</span>
            <div class="progress-track"><i id="progressBar"></i></div>
          </div>
        </div>

        <canvas id="pixiCanvas" aria-hidden="true"></canvas>
        <canvas id="gameCanvas" aria-label="像素共振区域"></canvas>
        <div id="slotCores" class="slot-cores" aria-hidden="true"></div>

        <button id="speedButton" class="speed-button" aria-label="切换二倍速">
          <span>»</span>
          <b>速度×2</b>
        </button>

        <button id="slotUnlockButton" class="slot-unlock" aria-label="观看视频解锁机器人阵地" hidden>
          <span>▶</span>
          <b>解锁</b>
          <small>视频</small>
        </button>

        <div id="toast" class="toast" role="status"></div>

        <div id="resultPanel" class="result-panel" hidden>
          <div class="result-burst">✦</div>
          <small id="resultEyebrow">任务完成</small>
          <h1 id="resultTitle">共振完成！</h1>
          <p id="resultText">能量核心已经吸收了所有像素</p>
          <button id="reviveButton" type="button" hidden>复活并消除</button>
          <button id="resultButton">再来一局</button>
        </div>
      </section>

      <section class="control-deck">
        <div id="queue" class="queue" aria-label="待命能量核心队列"></div>
        <p class="tip"><i></i> 机器人会沿安全路径寻找同色方块</p>
      </section>
    </main>

    <script type="module" src="./game.js"></script>
  </body>
</html>
